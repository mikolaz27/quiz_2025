services:
  backend:
    build: ./
    container_name: quiz_container
    working_dir: /quiz
    ports:
      - "8015:8025"
    command:
      - ./commands/start_server_dev.sh
    volumes:
      - ./src:/quiz/src
      - ./commands:/quiz/commands/
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:17.5
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
#  celery: ...

volumes:
  pg_data: { }